<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <title>Keller Systems &#8212; engineering registry</title>

  <!--
    Palette tokens. The light rendering is the primary one; the dark block
    below inverts the same tokens so the banner sits correctly on a dark
    GitHub theme instead of glowing as a bright plate.
  -->
  <style>
    .mono    { font-family: 'Geist Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .display { font-family: Archivo, 'Archivo Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; }

    .ground    { fill: #f2f0eb; }
    .block     { fill: #0c0c0d; }
    .plate     { fill: #ffffff; }
    .fg        { fill: #0c0c0d; }
    .fg-stroke { stroke: #0c0c0d; }
    .fg-muted  { fill: #62626a; }
    .on-block  { fill: #f2f0eb; }
    .on-block-stroke { stroke: #f2f0eb; }
    .rule      { stroke: #0c0c0d; }
    .rule-soft { stroke: #0c0c0d; stroke-opacity: 0.14; }
    .gridline  { stroke: #0c0c0d; stroke-opacity: 0.055; }

    @media (prefers-color-scheme: dark) {
      .ground    { fill: #0c0c0d; }
      .block     { fill: #f2f0eb; }
      .plate     { fill: #15151a; }
      .fg        { fill: #f2f0eb; }
      .fg-stroke { stroke: #f2f0eb; }
      .fg-muted  { fill: #9a9aa2; }
      .on-block  { fill: #0c0c0d; }
      .on-block-stroke { stroke: #0c0c0d; }
      .rule      { stroke: #f2f0eb; }
      .rule-soft { stroke: #f2f0eb; stroke-opacity: 0.22; }
      .gridline  { stroke: #f2f0eb; stroke-opacity: 0.07; }
    }
  </style>

  <defs>
    <pattern id="ksGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path class="gridline" d="M60 0H0V60" fill="none" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper ground + blueprint grid -->
  <rect class="ground" width="1200" height="400"/>
  <rect width="1200" height="400" fill="url(#ksGrid)"/>

  <!-- registry plate: hard offset shadow, 2px rule, ink header bar -->
  <rect class="block" x="878" y="88" width="250" height="170"/>
  <rect class="plate rule" x="870" y="80" width="250" height="170" stroke-width="2"/>
  <rect class="block" x="870" y="80" width="250" height="34"/>
  <rect fill="#ff4a17" x="884" y="93" width="9" height="9"/>
  <text class="mono on-block" x="902" y="103" font-size="12" letter-spacing="1.7">REGISTRY</text>
  <text class="mono fg-muted" x="1104" y="103" font-size="12" letter-spacing="1.7" text-anchor="end">KS-01</text>
  <line class="rule-soft" x1="886" y1="159" x2="1104" y2="159" stroke-width="1"/>
  <line class="rule-soft" x1="886" y1="204" x2="1104" y2="204" stroke-width="1"/>
  <text class="mono fg" x="886" y="142" font-size="12.5" letter-spacing="1.1">CRYPTOGRAPHY &amp; DSP</text>
  <text class="mono fg" x="886" y="187" font-size="12.5" letter-spacing="1.1">AEROSPACE &amp; HARDWARE</text>
  <text class="mono fg" x="886" y="232" font-size="12.5" letter-spacing="1.1">DEEP SENSING</text>

  <!-- eyebrow tag -->
  <rect class="plate rule" x="72" y="64" width="290" height="34" stroke-width="2"/>
  <rect fill="#ff4a17" x="88" y="76" width="10" height="10"/>
  <text class="mono fg" x="110" y="86" font-size="12.5" letter-spacing="1.7">ENGINEERING SYSTEMS &amp; R&amp;D</text>

  <!-- mark: ink field, signal inner frame, squared K -->
  <rect class="block" x="72" y="124" width="132" height="132"/>
  <rect fill="none" stroke="#ff4a17" stroke-width="4" x="82" y="134" width="112" height="112"/>
  <g transform="translate(82,134) scale(0.875)" fill="none" stroke-width="12" stroke-linecap="square">
    <path class="on-block-stroke" d="M40 30V98M40 64L88 30M40 64L88 98"/>
  </g>

  <!-- wordmark + technical subtitle -->
  <text class="display fg fg-stroke" x="232" y="196" font-size="52" letter-spacing="-1"
        stroke-width="1.8" paint-order="stroke">KELLER SYSTEMS</text>
  <text class="mono fg-muted" x="234" y="232" font-size="15" letter-spacing="2.6">PORTAL &amp; REGISTRY &#183; KELLERSYSTEMS.DEV</text>

  <!-- signature move: tilted ink ticker band -->
  <g transform="rotate(-1.4 600 330)">
    <rect class="block" x="-60" y="298" width="1320" height="64"/>
    <text class="mono on-block" x="36" y="338" font-size="16" letter-spacing="2.4">POST-QUANTUM MESH<tspan fill="#ff4a17">&#160;&#160;///&#160;&#160;</tspan>MUON TOMOGRAPHY<tspan fill="#ff4a17">&#160;&#160;///&#160;&#160;</tspan>REAL-TIME KERNELS<tspan fill="#ff4a17">&#160;&#160;///&#160;&#160;</tspan>ZERO-KNOWLEDGE PROOFS<tspan fill="#ff4a17">&#160;&#160;///&#160;&#160;</tspan>FORMAL VERIFICATION</text>
  </g>

  <!-- frame last, so it rules over the band edges -->
  <rect class="rule" x="1.5" y="1.5" width="1197" height="397" fill="none" stroke-width="3"/>
</svg>
